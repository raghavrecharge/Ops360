# Astro Jyotish - Docker Compose Configuration
# Runs both frontend and backend services together

version: '3.8'

services:
  # Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: astrojyotish-backend
    ports:
      - "8001:8001"
    environment:
      - USE_SQLITE=true
      - DATABASE_URL=sqlite:////app/data/astroos.db
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-me}
      - CORS_ORIGINS=*
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - backend_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Frontend Web Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_URL: http://backend:8001
    container_name: astrojyotish-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
    driver: local

networks:
  default:
    name: astrojyotish-network
